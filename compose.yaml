services:
  mongodb:
    image: mongo:8.2
    container_name: profile-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_APP_USER: ${MONGO_APP_USER:?MONGO_APP_USER is required}
    volumes:
      - mongo_data:/data/db
      - ./mongodb-init:/docker-entrypoint-initdb.d:ro
    secrets:
      - mongo_root_password
      - mongo_app_password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: profile-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: profiledb
      MONGO_APP_USER: ${MONGO_APP_USER:?MONGO_APP_USER is required}
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
      SESSION_SECRET_FILE: /run/secrets/session_secret
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - mongo_app_password
      - session_secret
      - admin_password
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:

secrets:
  mongo_root_password:
    file: ./secrets/mongo_root_password
  mongo_app_password:
    file: ./secrets/mongo_app_password
  session_secret:
    file: ./secrets/session_secret
  admin_password:
    file: ./secrets/admin_password
